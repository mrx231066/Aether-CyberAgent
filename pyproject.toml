[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "aether-cyberagent"
version = "0.3.0"
description = "Autonomous Multi-Agent AI Security Platform"
requires-python = ">=3.11"
dependencies = [
    "google-genai",
    "pydantic",
    "typer[all]",
    "rich",
    "z3-solver",
    "networkx",
    "hypothesis",
    "docker",
    "streamlit",
    "prompt_toolkit>=3.0.0",
    "pytest",
    "google-auth-oauthlib",
    "Pillow"
]

[project.scripts]
aether = "aether.cli.main:app"
