[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "aether-cyberagent"
version = "0.1.0"
description = "Autonomous Multi-Agent AI Security Platform"
requires-python = ">=3.11"
dependencies = [
    "google-genai",
    "pydantic",
    "typer[all]",
    "rich",
    "z3-solver",
    "networkx",
    "hypothesis",
    "docker",
    "streamlit",
    "pytest"
]

[project.scripts]
aether = "aether.cli.main:app"
