[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "aether-cyberagent"
version = "1.0.5"
description = "Elite AI security engineer and autonomous developer agent."
authors = [{ name = "Jashan Nain", email = "jashan@example.com" }]
license = { text = "MIT" }
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "typer>=0.15.1",
    "rich>=13.9.4",
    "google-genai>=0.5.0",
    "pydantic>=2.10.6",
    "pytest>=8.3.4",
    "google-auth-oauthlib>=1.2.0",
    "Pillow>=10.0.0",
    "prompt_toolkit>=3.0.43",
    "z3-solver",
    "networkx",
    "hypothesis",
    "docker",
    "streamlit"
]

[project.scripts]
aether = "aether.cli.main:app"
